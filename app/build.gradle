plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    signingConfigs {
         release {
             storeFile file('/Users/63619/AndroidStudioProjects/Ecom Projects/service-center/app/keyStore/EcomServiceCenter.jks')
             storePassword 'android'
             keyAlias 'android'
             keyPassword 'android'
         }
    }
    namespace 'com.servicecenter.l2validation'
    compileSdk 34

    defaultConfig {
        applicationId "com.servicecenter.l2validation"
        minSdk 25
        targetSdk 33
        versionCode 7
        versionName "1.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
       signingConfig signingConfigs.release
    }

    buildTypes {
        debug {
            buildConfigField("String", "BASE_URL", "\"https://servicecenter-test.ecomexpress.in/\"")// Public TEST Environment
            // buildConfigField("String", "BASE_URL", "\"https://servicecenter.ecomexpress.in/\"") // Public Production Environment
            buildConfigField("String", "IS_MOCK_API", "\"false\"")
            debuggable true
        }
        release {
           // buildConfigField("String", "BASE_URL", "\"https://servicecenter-test.ecomexpress.in/\"")// Public TEST Environment

            buildConfigField("String", "BASE_URL", "\"https://servicecenter.ecomexpress.in/\"")  // Public Production Environment
            buildConfigField("String", "IS_MOCK_API", "\"false\"")
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    dataBinding {
        enabled = true
    }

}


dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Splash screen
//    implementation("androidx.core:core-splashscreen:1.0.1")

    //ViewModels
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.activity:activity:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation('androidx.navigation:navigation-fragment-ktx:2.6.0')
    implementation('androidx.navigation:navigation-ui-ktx:2.6.0')

    //Viewpager
    implementation 'com.tbuonomo:dotsindicator:4.2'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.46.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.46.1'
    kapt "com.google.dagger:hilt-android-compiler:2.46.1"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.8'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'

    //zxing
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation files('libs/nlscan_sdk_master.jar')
    implementation 'androidx.fragment:fragment-ktx:1.6.0'


    // Room dependencies
    implementation "androidx.room:room-runtime:2.5.2"
    kapt "androidx.room:room-compiler:2.5.2"
    implementation "androidx.room:room-ktx:2.5.2"

    // data store
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.12.5'

    //Camera X
    implementation "androidx.camera:camera-core:1.2.1"
    implementation "androidx.camera:camera-camera2:1.2.1"
    implementation "androidx.camera:camera-lifecycle:1.2.1"
    implementation "androidx.camera:camera-view:1.2.1"
    //FireBase
    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.6.2'
    implementation 'com.google.firebase:firebase-analytics-ktx:21.5.1'
    implementation 'com.google.firebase:firebase-config-ktx:22.0.0'


    implementation "io.esper.devicesdk:app:3.3.0101.27"
    implementation 'com.google.android.gms:play-services-location:21.3.0'


    //GoogleMap
    implementation 'com.google.android.gms:play-services-maps:18.0.2'
    implementation 'com.google.android.gms:play-services-location:21.0.1'




}